[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-ats-keyword-checker"
version = "0.1.0"
description = "Compare a CV (txt, docx, pdf) with a job description: matched and missing keywords, synonyms and a coverage score."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["python-docx>=1.1", "pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cv-ats = "cv_ats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
